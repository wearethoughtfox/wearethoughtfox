<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>We Are Thought Fox CMS</title>
  </head>
  <body>
    <!--
      Sveltia CMS, set up the way Root's is. Served as a plain static file on
      purpose: loading the CMS from a SvelteKit route can write empty files
      and leave .sveltia-tmp-* behind.

      The version is pinned because Sveltia is pre-1.0 and ships breaking
      changes between releases. To update, bump the version here and check
      the release notes: https://github.com/sveltia/sveltia-cms/releases

      Do not add type="module" (the bundle is not an ES module) or a
      stylesheet link.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.250.0/dist/sveltia-cms.js"></script>
  </body>
</html>
